<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Join the Glas Bench annotation group</title>
  <meta name="description" content="An invitation to read and annotate two documents side by side on Glas Bench: a Hypothesis account, the group, and the bench.">
  <!-- the share card for the invitation; the page itself goes straight to the bench with the joining guide open -->
  <meta http-equiv="refresh" content="0; url=./?help=join">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <style>
    :root { --bg: #15130e; --text: #ece6d6; --beam: #d8b63c; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f3ea; --text: #1d1b16; --beam: #8a6d1f; } }
    body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    a { color: var(--beam); }
  </style>
  <script>location.replace('./?help=join' + (location.hash.length > 1 ? '&join=' + encodeURIComponent(location.hash.slice(1)) : ''));</script>
</head>
<body>
  <p>Opening Glas Bench with the guide to joining the annotation group… If nothing happens, <a href="./?help=join">open it here</a>.</p>
</body>
</html>
