<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Glas Bench</title>
  <meta name="description" content="A bench for reading two documents side by side, in two columns of equal standing, after Derrida's Glas: a technical document on AI against a text from the critical tradition.">
  <!-- Bench version: the ?v= on every script and stylesheet below. Raise it by
       0.0.1 on every push that changes the bench, all tags alike, so browsers
       fetch fresh copies. kit/base.js reads it from its own tag. Set bench-date to
       the day of the release; the About box (kit/about.js) shows both. -->
  <meta name="bench-date" content="2026-10-14">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link rel="stylesheet" href="kit/bench.css?v=0.2.12">
  <link rel="stylesheet" href="kit/themes.css?v=0.2.12">
  <link rel="stylesheet" href="css/research.css?v=0.2.12">
  <link rel="stylesheet" href="kit/paratexts.css?v=0.2.12">
  <link rel="stylesheet" href="kit/kit.css?v=0.2.12">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" title="About the bench">
      <img src="img/icon.svg" alt="" width="26" height="26">
      <span class="brand-name"><b>Glas</b> <b>Bench</b></span>
      <span class="bench-ver" id="bench-ver"></span>
    </a>
    <label class="pick">
      <span>Document</span>
      <select id="pick-a" aria-label="Document"></select>
      <span class="swref" id="vref" title="The bench’s reference to this source"></span>
    </label>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button data-tab="pair" class="on" title="Read two documents side by side, a column each, against each other">Pair</button>
      <button data-tab="threads" title="Threads: joins gathered under a name and read in order, across sessions">Threads</button>
      <button data-menu="read" data-tabs="read" aria-expanded="false" title="Read one document on its own">Read <span class="caret" aria-hidden="true">▾</span></button>
      <button data-tab="about" title="About the bench: its purpose, sources and citation">About</button>
      <button data-tab="findings" title="What the bench and the group have established, with evidence; shared">Findings</button>
      <button data-tab="notes" title="What you have gathered for writing: excerpts, notes, findings; private, in this browser">My notes</button>
      <button data-tab="paratexts" title="The scans, documents and links of the programme, shared with the group">Paratexts</button>
      <button data-menu="help" aria-expanded="false" title="About the bench, settings, the code">Help <span class="caret" aria-hidden="true">▾</span></button>
    </nav>
    <div class="bar-right">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <span class="size-btns"><button class="icon-btn" id="btn-smaller" title="Smaller text over the documents: post-its, editors, lists">A−</button><button class="icon-btn" id="btn-larger" title="Larger text over the documents: post-its, editors, lists">A+</button></span>
      <button class="icon-btn" id="btn-theme" title="Switch between your last light and dark colour themes (choose themes in ⚙ Settings)">◐</button>
      <button class="icon-btn" id="btn-code" title="Go to a code: an annotation (A-, R-), a finding (C-, F), a note (initials-N)">#</button>
      <button class="icon-btn news-btn" id="btn-news" title="What’s new in the group’s annotations">✉<span class="news-n" id="news-n"></span></button>
      <!-- About is in the Help menu; this hidden button carries its handler -->
      <button class="icon-btn" id="btn-about" hidden>ⓘ</button>
      <button class="icon-btn" id="btn-settings" title="Your initials and the Hypothesis group, colour theme, font and size">⚙</button>
    </div>
  </header>

  <noscript><div class="noscript">Glas Bench runs in JavaScript, which is turned off in this browser.</div></noscript>

  <main id="main">
    <section class="view on" id="view-pair"></section>
    <section class="view" id="view-threads"></section>
    <section class="view" id="view-read"></section>
    <section class="view" id="view-about"></section>
    <section class="view" id="view-findings"></section>
    <section class="view" id="view-notes"></section>
    <section class="view" id="view-paratexts"></section>
  </main>

  <!-- the bench's documents, the kit's foundation and this bench's settings, then the rest.
       The genealogy half of the kit (lenses, functional, compare, stemma, version) is still
       loaded but switched off in js/main.js and js/config.js; it is removed when the Pair
       view replaces Read in Phase 1. -->
  <script src="kit/versionlist.js?v=0.2.12"></script>
  <script src="js/versions.js?v=0.2.12"></script>
  <script src="kit/export.js?v=0.2.12"></script>
  <script src="kit/lang-plain.js?v=0.2.12"></script>
  <script src="kit/genealogy.js?v=0.2.12"></script>
  <script src="kit/base.js?v=0.2.12"></script>
  <script src="js/config.js?v=0.2.12"></script>
  <script src="js/programme.js?v=0.2.12"></script>
  <script src="kit/md.js?v=0.2.12"></script>
  <script src="kit/themes.js?v=0.2.12"></script>
  <script src="kit/refs.js?v=0.2.12"></script>
  <script src="kit/builds.js?v=0.2.12"></script>
  <script src="js/core.js?v=0.2.12"></script>
  <script src="kit/initials.js?v=0.2.12"></script>
  <script src="kit/settings.js?v=0.2.12"></script>
  <script src="js/swhid.js?v=0.2.12"></script>
  <script src="kit/notes.js?v=0.2.12"></script>
  <script src="kit/tray.js?v=0.2.12"></script>
  <script src="kit/figures.js?v=0.2.12"></script>
  <script src="kit/readnotes.js?v=0.2.12"></script>
  <script src="kit/read.js?v=0.2.12"></script>
  <script src="js/read.js?v=0.2.12"></script>
  <script src="kit/menus.js?v=0.2.12"></script>
  <script src="kit/functional.js?v=0.2.12"></script>
  <script src="kit/lenses.js?v=0.2.12"></script>
  <script src="js/analyse.js?v=0.2.12"></script>
  <script src="js/compare-defs.js?v=0.2.12"></script>
  <script src="kit/compare.js?v=0.2.12"></script>
  <script src="kit/stemma.js?v=0.2.12"></script>
  <script src="kit/version.js?v=0.2.12"></script>
  <script src="kit/edition.js?v=0.2.12"></script>
  <script src="js/findings-data.js?v=0.2.12"></script>
  <script src="kit/findings.js?v=0.2.12"></script>
  <script src="js/findings-checks.js?v=0.2.12"></script>
  <script src="js/tour.js?v=0.2.12"></script>
  <script src="kit/tours.js?v=0.2.12"></script>
  <script src="kit/paratexts.js?v=0.2.12"></script>
  <script src="kit/guides.js?v=0.2.12"></script>
  <script src="kit/helppages.js?v=0.2.12"></script>
  <script src="kit/about.js?v=0.2.12"></script>
  <script src="js/pair.js?v=0.2.12"></script>
  <script src="js/highlights.js?v=0.2.12"></script>
  <script src="js/links.js?v=0.2.12"></script>
  <script src="js/postits.js?v=0.2.12"></script>
  <script src="js/threads.js?v=0.2.12"></script>
  <script src="js/textsize.js?v=0.2.12"></script>
  <script src="js/main.js?v=0.2.12"></script>
  <script src="kit/shell.js?v=0.2.12"></script>
</body>
</html>
